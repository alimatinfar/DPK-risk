      # - task: PythonScript@0
      #   inputs:
      #     scriptSource: 'inline'
      #     script: |
      #       import json
      #       def updateJsonFile():
      #           jsonFile = open("nswag/service.config.nswag", "r") # Open the JSON file for reading
      #           data = json.load(jsonFile) # Read the JSON into the buffer
      #           jsonFile.close() # Close the JSON file
