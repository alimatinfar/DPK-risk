      - task: PythonScript@0
        inputs:
          scriptSource: 'inline'
          script: |
            import json
            def updateJsonFile():
                jsonFile = open("$(configjson)", "r") # Open the JSON file for reading
                data = json.load(jsonFile) # Read the JSON into the buffer
                jsonFile.close() # Close the JSON file
                data["baseUrl"] = "$(baseUrl)" 
                data["client_id"] = "$(client_id)" 
                data["frontBaseUrl"] = "$(frontBaseUrl)" 
                data["ssoUrl"] = "$(ssoUrl)"                 
                jsonFile = open("$(configjson)", "w+")
                jsonFile.write(json.dumps(data, indent=1))
                jsonFile.close()
            updateJsonFile()
          pythonInterpreter: '/usr/bin/python3'                            

      - task: Bash@3
        inputs:
          targetType: 'inline'
          script: |
            DOCKER_BUILDKIT=1 docker build --file Dockerfile --output out .    


      - task: Bash@3
        inputs:
          targetType: 'inline'
          script: |
            mkdir $(Build.ArtifactStagingDirectory)/Proc1
            rm -r $(Build.ArtifactStagingDirectory)/*                         
            cp -r $(System.DefaultWorkingDirectory)/out/dist $(Build.ArtifactStagingDirectory) 

      - task: Bash@3
        inputs:
          targetType: 'inline'
          script: | 
            rm -r $(System.DefaultWorkingDirectory)/out 
            pwd
            echo y | docker buildx prune --all    

      - task: PublishBuildArtifacts@1
        condition: and(succeeded(), eq(variables['ispullrequest'], 'true'))                

      - script: |
          set -e  

          echo "[Clean] $(Build.BinariesDirectory)"

          if [ -d "$(Build.BinariesDirectory)" ]; then

            chmod -R u+rwX "$(Build.BinariesDirectory)" || true

            rm -rf "$(Build.BinariesDirectory)"/* "$(Build.BinariesDirectory)"/.[!.]* "$(Build.BinariesDirectory)"/..?* || true
          fi

          echo "[Clean] $(System.DefaultWorkingDirectory)"
          if [ -d "$(System.DefaultWorkingDirectory)" ]; then
            chmod -R u+rwX "$(System.DefaultWorkingDirectory)" || true
            rm -rf "$(System.DefaultWorkingDirectory)"/* "$(System.DefaultWorkingDirectory)"/.[!.]* "$(System.DefaultWorkingDirectory)"/..?* || true
          fi

          echo "[Clean] $(Build.ArtifactStagingDirectory)"
          if [ -d "$(Build.ArtifactStagingDirectory)" ]; then
            chmod -R u+rwX "$(Build.ArtifactStagingDirectory)" || true
            rm -rf "$(Build.ArtifactStagingDirectory)"/* "$(Build.ArtifactStagingDirectory)"/.[!.]* "$(Build.ArtifactStagingDirectory)"/..?* || true
          fi
        displayName: 'Deep clean (Linux – incl. .git, hidden)'
        condition: always()


  - job: Clean
    workspace:
      clean: all
    dependsOn:
    - GetSemVer
    - SetVersion
    condition: |
      and
      (
        in(dependencies.GetSemVer.result, 'Succeeded', 'SucceededWithIssues', 'Skipped','canceled','Failed'),
        in(dependencies.SetVersion.result, 'Succeeded', 'SucceededWithIssues', 'Skipped','canceled','Failed')
      )
    steps:
    - checkout: none
    - task: PostBuildCleanup@3         
                  