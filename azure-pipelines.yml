resources:
  - repo: self
pool:
  name: DockerAgents
  demands:
    - npm
    
trigger:
    branches:
      include:
      - develop
      - master 
      - test     

#variables:
  # variable group :
#  - group: Information
#  - group: Bank
stages:
- stage:
  jobs:
  - job: GetSemVer
    displayName: Get Semantic Version 
#    workspace:
#      clean: all
    steps:
    - powershell: |
        $version = (node -p -e "require('./package.json').version").Trim()
        echo "version: "
        echo $version
        echo "##vso[task.setvariable variable=version;isOutput=true]$version"
        
      displayName: Set Version Variable 
      name: App 
  - job: SetVersion
    displayName: Set Build Number
    dependsOn: GetSemVer
    
    timeoutInMinutes: 50
    continueOnError: false
    variables:
      appVersion: $[ dependencies.GetSemVer.outputs['App.version'] ]
      buildIncrement: $[counter(variables['appVersion'], 0)]
      buildVersion: "$(appVersion)-$(buildIncrement)"
    steps:
      
      - powershell: |
          switch ("$(Build.SourceBranch)"){
          "refs/heads/master" { $VersionPostFix = "" }
          "refs/heads/test" { $VersionPostFix = "-beta" }
          "refs/heads/develop" { $VersionPostFix = "-alpha" }
          Default {$VersionPostFix = "-SNAPSHOT"}
          }
          Write-Host "appVersion: $(appVersion)"
          echo "##vso[build.updatebuildnumber]$(buildVersion)$VersionPostFix"
          Write-Host $(Build.BuildNumber)

        displayName: 'Set Version to BuildNumber'

      - powershell: |
              switch ("$(Build.SourceBranch)"){
                {($_ -eq "refs/heads/test") -or ($_ -eq "refs/heads/develop") -or ($_ -eq "refs/heads/master")} {
                                 Write-Host "##vso[task.setvariable variable=ispullrequest;]true"
                                }
              }
        displayName: Set Pull request condition.


      - powershell: |
              switch ("$(Build.SourceBranch)"){
                {($_ -eq "refs/heads/test") -or ($_ -eq "refs/heads/master")} {
                                 Write-Host "##vso[task.setvariable variable=sonarqube;]true"
                                }
              }
        displayName: Set Sonar condition.        


      - powershell: |
          switch ("$(Build.SourceBranch)"){
          "refs/heads/test" {
                             Write-Host "##vso[task.setvariable variable=ApiUrl;]$env:APIURLTEST"  
                             Write-Host "##vso[task.setvariable variable=AuthUrl;]$env:AUTHURLTEST"
                             Write-Host "##vso[task.setvariable variable=HelpUrl;]$env:HELPURLTEST"
                             Write-Host "##vso[task.setvariable variable=ClientId;]$env:CLIENTIDTEST"
                             Write-Host "##vso[task.setvariable variable=nswagUrl;]$env:NSWAGURLTEST"
                            }

          "refs/heads/Master"  {
                                Write-Host "##vso[task.setvariable variable=baseUrl;]$env:BASEURLMASTER"  
                                Write-Host "##vso[task.setvariable variable=client_id;]$env:CLIENT_IDMASTER"
                                Write-Host "##vso[task.setvariable variable=frontBaseUrl;]$env:FRONTBASEURLMASTER"
                                Write-Host "##vso[task.setvariable variable=ssoUrl;]$env:SSOURLMASTER"                                 
                               }   

          Default {
                   Write-Host "##vso[task.setvariable variable=baseUrl;]$env:BASEURLDEV"  
                   Write-Host "##vso[task.setvariable variable=client_id;]$env:CLIENT_IDDEV"
                   Write-Host "##vso[task.setvariable variable=frontBaseUrl;]$env:FRONTBASEURLDEV"
                   Write-Host "##vso[task.setvariable variable=ssoUrl;]$env:SSOURLDEV"                   
                  }
          }
          
        displayName: 'Set Api Variable'


      - task: PythonScript@0
        inputs:
          scriptSource: 'inline'
          script: |
            import json
            def updateJsonFile():
                jsonFile = open("package.json", "r") # Open the JSON file for reading
                data = json.load(jsonFile) # Read the JSON into the buffer
                jsonFile.close() # Close the JSON file                                    
                data["version"] = "$(Build.BuildNumber)" 
                jsonFile = open("package.json", "w+")
                jsonFile.write(json.dumps(data, indent=1))
                jsonFile.close()                                    
            updateJsonFile()
          pythonInterpreter: '/usr/bin/python3'            


      # - task: SonarQubePrepare@4
      #   condition: and(succeeded(), eq(variables['sonarqube'], 'true'))
      #   displayName: 'Prepare analysis on SonarQube'
